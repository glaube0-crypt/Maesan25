<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0A5651">
<title>순천매산고 25회 · 5070 추억여행 포토프레임</title>
<style>
  :root{ --teal:#0A5651; --gold:#F2C230; --gold2:#FFD75E; --cream:#FFF6DF; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:#083F3B; color:var(--cream);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    display:flex; justify-content:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .app{width:100%; max-width:480px; padding:14px 14px 26px;}

  /* 프레임(=결과물) 미리보기 : 촬영 중에도 이 안에 사람이 보입니다 */
  .stage{position:relative; width:100%; border-radius:10px; overflow:hidden; box-shadow:0 12px 34px rgba(0,0,0,.4);}
  #cv{width:100%; display:block;}
  .badge{
    position:absolute; top:10px; left:10px; padding:6px 11px; border-radius:999px;
    background:rgba(0,0,0,.42); font-size:12px; font-weight:700; letter-spacing:.04em;
    color:var(--cream); backdrop-filter:blur(3px);
  }
  video{display:none;}

  .pad{height:14px;}
  .row{display:flex; gap:9px;}
  .row > *{flex:1;}
  .btn{border:none; border-radius:14px; padding:15px 12px; font-size:16px; font-weight:700;
       font-family:inherit; cursor:pointer; width:100%;}
  .btn-gold{background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#0A3F3B;}
  .btn-line{background:transparent; color:var(--cream); border:1.5px solid rgba(255,246,223,.42);}
  .mini{background:rgba(255,255,255,.07); color:var(--cream); border:1px solid rgba(255,246,223,.28);
        border-radius:12px; padding:12px 8px; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer;}
  .shutter{width:76px;height:76px;border-radius:50%;border:5px solid var(--gold);background:var(--cream);
           cursor:pointer;display:block;margin:0 auto;}
  .shutter:active{transform:scale(.94);}

  .label{font-size:13.5px; font-weight:700; color:var(--gold); letter-spacing:.04em; margin:0 0 8px;}
  .inputrow{display:flex; gap:8px;}
  .inputrow input{flex:1; min-width:0; padding:14px; border-radius:12px;
    border:1.5px solid rgba(255,246,223,.32); background:rgba(255,255,255,.06);
    color:var(--cream); font-size:16px; font-family:inherit;}
  .inputrow input::placeholder{color:rgba(255,246,223,.38);}
  .inputrow button{flex:0 0 auto; padding:0 17px; border-radius:12px; border:none; background:var(--gold);
    color:#0A3F3B; font-weight:800; font-size:16px; font-family:inherit; cursor:pointer;}
  .chips{display:flex; flex-wrap:wrap; gap:7px; margin-top:9px;}
  .chip{display:inline-flex; align-items:center; gap:7px; padding:8px 12px; border-radius:999px;
    background:rgba(242,194,48,.16); border:1px solid rgba(242,194,48,.5); font-size:14.5px; font-weight:600; cursor:pointer;}
  .chip span{opacity:.65;}
  .hint{font-size:12.5px; color:rgba(255,246,223,.55); line-height:1.65; margin-top:10px;}
  .err{background:rgba(255,90,80,.15); border:1px solid rgba(255,140,130,.5); color:#ffd9d5;
       padding:13px; border-radius:12px; font-size:13.5px; line-height:1.6; display:none; margin-top:12px;}
  .hide{display:none !important;}
</style>
</head>
<body>
<div class="app">

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="badge" id="badge">촬영 준비</div>
  </div>

  <div class="pad"></div>

  <!-- 시작 -->
  <div id="g-start">
    <button class="btn btn-gold" id="btn-start">카메라 켜기</button>
    <div class="hint">카메라를 켜면 위 프레임 안에 실제 화면이 그대로 보입니다. 보이는 그대로 저장됩니다.</div>
  </div>

  <!-- 촬영 중 -->
  <div id="g-live" class="hide">
    <button class="shutter" id="btn-shot" aria-label="촬영"></button>
    <div class="pad"></div>
    <div class="row">
      <button class="mini" id="btn-ratio">비율 · 방향</button>
      <button class="mini" id="btn-flip">전/후면 전환</button>
      <button class="mini" id="btn-off">카메라 끄기</button>
    </div>
  </div>

  <!-- 촬영 후 -->
  <div id="g-done" class="hide">
    <button class="btn btn-gold" id="btn-save">사진 저장 / 공유</button>
    <div class="pad"></div>
    <div class="row">
      <button class="mini" id="btn-ratio2">비율 · 방향</button>
      <button class="mini" id="btn-retake">다시 촬영</button>
    </div>
  </div>

  <div class="pad"></div>

  <div class="label">함께 찍은 사람 이름</div>
  <div class="inputrow">
    <input id="name-input" type="text" placeholder="이름 입력 후 추가" autocomplete="off" enterkeyhint="done">
    <button id="btn-add">추가</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="hint">쉼표(,)로 여러 명을 한 번에 넣을 수 있고, 이름을 누르면 지워집니다. 촬영 전에 미리 넣어도 됩니다.</div>
  <div class="hint" id="save-hint"></div>
  <div class="err" id="err"></div>

  <video id="video" playsinline autoplay muted></video>
  <input type="file" id="fallback-file" accept="image/*" capture="environment" style="display:none">
</div>

<script>
(function(){
  "use strict";

  /* ======== 설정 (문구·색은 여기만 고치면 됩니다) ======== */
  const CFG = {
    school:"순천매산고등학교 25회",
    title :"5070 추억여행",
    date  :"(2026.9.4~5)",
    teal  :"#0A5651", teal2:"#0E6D65", teal3:"#08433F",
    gold  :"#F2C230", cream:"#FFF6DF",
    file  :"매산25회_추억여행"
  };
  const FONT = '"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';

  /* 옛날 인화사진 비율 (가로/세로 전환 포함) */
  const RATIOS = [
    {w:4,h:3, name:"4:3 가로"},
    {w:3,h:4, name:"4:3 세로"},
    {w:3,h:2, name:"3:2 가로"},
    {w:2,h:3, name:"3:2 세로"}
  ];
  let rIdx = 0;

  const $ = id=>document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d");
  const chrome = document.createElement("canvas"), cctx = chrome.getContext("2d");
  const meas = document.createElement("canvas").getContext("2d");
  const video = $("video"), badge = $("badge"), errBox = $("err"), saveHint = $("save-hint");

  let stream=null, facing="environment", running=false, rafId=0;
  let source=null;      // 촬영된 원본 프레임(캔버스). null이면 라이브
  let names=[], L=null;

  const W = 1080, PADX = 84, PHOTO_Y = 244, MAT = 14; // MAT: 옛날 사진 흰 여백
  const EM_R = 58, HEAD_CY = 122;                     // 상단 교표(엠블럼)
  const T1 = 58, T2 = 34;                             // 하단 타이틀 / 날짜 글자 크기

  /* ================= 레이아웃 ================= */
  function fitNames(list){
    const text = list.join("   ·   "), MAXW = W - 210;
    for(const s of [48,44,40,36,32,29]){
      meas.font = "700 "+s+"px "+FONT;
      if(meas.measureText(text).width <= MAXW) return {lines:[text], size:s};
    }
    const half = Math.ceil(list.length/2);
    const a = list.slice(0,half).join("   ·   "), b = list.slice(half).join("   ·   ");
    for(const s of [40,36,32,28,25,22]){
      meas.font = "700 "+s+"px "+FONT;
      if(Math.max(meas.measureText(a).width, meas.measureText(b).width) <= MAXW) return {lines:[a,b], size:s};
    }
    return {lines:[a,b], size:22};
  }
  function computeLayout(){
    const r = RATIOS[rIdx];
    const pw = W - PADX*2;
    const ph = Math.round(pw * r.h / r.w);
    const px = PADX, py = PHOTO_Y, pb = py + ph;
    const nl = names.length ? fitNames(names) : null;
    let nameY=0, titleY, H;
    if(nl){
      nameY  = pb + MAT + 68;
      titleY = nameY + (nl.lines.length-1)*(nl.size+14) + 86;
    }else{
      titleY = pb + MAT + 104;
    }
    H = titleY + 76;
    return {pw,ph,px,py,pb,nl,nameY,titleY,H};
  }

  /* ================= 프레임(사진 뺀 나머지) 그리기 ================= */
  function drawEmblem(g,cx,cy,r){
    g.save(); g.fillStyle = CFG.gold;
    for(let i=0;i<16;i++){
      const a=(Math.PI*2/16)*i, x=cx+Math.cos(a)*r*0.66, y=cy+Math.sin(a)*r*0.66;
      g.save(); g.translate(x,y); g.rotate(a+Math.PI/2);
      g.beginPath(); g.ellipse(0,0,r*0.108,r*0.172,0,0,Math.PI*2); g.fill(); g.restore();
    }
    const s=r*0.76, rr=r*0.09, x0=cx-s/2, y0=cy-s/2;
    g.fillStyle=CFG.teal; g.strokeStyle=CFG.gold; g.lineWidth=Math.max(3,r*0.06);
    g.beginPath(); g.moveTo(x0+rr,y0);
    g.arcTo(x0+s,y0,x0+s,y0+s,rr); g.arcTo(x0+s,y0+s,x0,y0+s,rr);
    g.arcTo(x0,y0+s,x0,y0,rr); g.arcTo(x0,y0,x0+s,y0,rr); g.closePath(); g.fill(); g.stroke();
    g.fillStyle=CFG.gold; g.textAlign="center"; g.textBaseline="middle";
    g.font="700 "+(r*0.34).toFixed(0)+"px "+FONT;
    g.fillText("매",cx,cy-r*0.17); g.fillText("산",cx,cy+r*0.19);
    g.restore();
  }
  function ls(g,v){ try{ g.letterSpacing=v; }catch(e){} }

  function renderChrome(){
    L = computeLayout();
    chrome.width = W; chrome.height = L.H;
    const g = cctx;
    const bg = g.createLinearGradient(0,0,W,L.H);
    bg.addColorStop(0,CFG.teal2); bg.addColorStop(.55,CFG.teal); bg.addColorStop(1,CFG.teal3);
    g.fillStyle=bg; g.fillRect(0,0,W,L.H);

    g.strokeStyle=CFG.gold; g.lineWidth=10; g.strokeRect(26,26,W-52,L.H-52);
    g.strokeStyle="rgba(242,194,48,.55)"; g.lineWidth=2.5; g.strokeRect(46,46,W-92,L.H-92);

    /* 상단: [교표] 순천매산고등학교 25회 — 한 줄 가운데 정렬 */
    ls(g,"7px"); g.font="700 42px "+FONT;
    const sw = g.measureText(CFG.school).width;
    const gap = 26, groupW = EM_R*2 + gap + sw;
    const sx0 = (W - groupW)/2;
    drawEmblem(g, sx0 + EM_R, HEAD_CY, EM_R);
    g.textAlign="left"; g.textBaseline="middle"; g.fillStyle=CFG.gold;
    g.fillText(CFG.school, sx0 + EM_R*2 + gap, HEAD_CY + 2);
    ls(g,"0px");
    g.textAlign="center"; g.textBaseline="alphabetic";

    // 옛날 인화사진 느낌의 흰 여백 + 골드 라인
    g.fillStyle=CFG.cream;
    g.fillRect(L.px-MAT, L.py-MAT, L.pw+MAT*2, L.ph+MAT*2);
    g.strokeStyle=CFG.gold; g.lineWidth=4;
    g.strokeRect(L.px-MAT-2, L.py-MAT-2, L.pw+MAT*2+4, L.ph+MAT*2+4);
    g.fillStyle="#123"; g.fillRect(L.px, L.py, L.pw, L.ph);

    if(L.nl){
      g.fillStyle=CFG.cream; ls(g,"1px"); g.font="700 "+L.nl.size+"px "+FONT;
      L.nl.lines.forEach((t,i)=> g.fillText(t, W/2, L.nameY + i*(L.nl.size+14)));
      ls(g,"0px");
    }
    /* 하단: 5070 추억여행 (2026.9.4~5) — 한 줄 가운데 정렬 */
    g.textAlign="left";
    g.font="800 "+T1+"px "+FONT; const w1 = g.measureText(CFG.title).width;
    g.font="600 "+T2+"px "+FONT; const w2 = g.measureText(CFG.date).width;
    const sp = 16, x0 = (W - (w1+sp+w2))/2;
    g.fillStyle=CFG.cream; g.font="800 "+T1+"px "+FONT;
    g.fillText(CFG.title, x0, L.titleY);
    g.fillStyle="rgba(242,194,48,.95)"; g.font="600 "+T2+"px "+FONT;
    g.fillText(CFG.date, x0 + w1 + sp, L.titleY);
    g.textAlign="center";

    cv.width = W; cv.height = L.H;
  }

  /* ================= 합성(프레임 + 사진) ================= */
  function drawInto(src, sw, sh, mirror){
    // 대상 비율에 맞춰 가운데 크롭
    const tR = L.pw/L.ph, sR = sw/sh;
    let cw, ch;
    if(sR > tR){ ch = sh; cw = sh*tR; } else { cw = sw; ch = sw/tR; }
    const sx = (sw-cw)/2, sy = (sh-ch)/2;
    ctx.save();
    ctx.beginPath(); ctx.rect(L.px,L.py,L.pw,L.ph); ctx.clip();
    if(mirror){ ctx.translate(L.px*2+L.pw,0); ctx.scale(-1,1); }
    ctx.drawImage(src, sx, sy, cw, ch, L.px, L.py, L.pw, L.ph);
    ctx.restore();
  }
  function paint(){
    ctx.drawImage(chrome,0,0);
    if(source) drawInto(source, source.width, source.height, false);
    else if(video.videoWidth) drawInto(video, video.videoWidth, video.videoHeight, facing==="user");
  }
  function loop(){ if(!running) return; paint(); rafId = requestAnimationFrame(loop); }
  function refresh(){ renderChrome(); paint(); }

  /* ================= 카메라 ================= */
  async function startCam(){
    stopCam();
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video:{facingMode:{ideal:facing}, width:{ideal:1920}, height:{ideal:1440}}, audio:false});
      video.srcObject = stream;
      await video.play().catch(()=>{});
      source = null; running = true;
      setMode("live"); refresh(); loop();
    }catch(e){
      errBox.style.display="block";
      errBox.innerHTML = "브라우저 카메라를 열 수 없습니다.<br>(https 주소가 아니거나 권한이 거부된 경우) 휴대폰 기본 카메라로 촬영합니다.";
      $("fallback-file").click();
    }
  }
  function stopCam(){
    running=false; cancelAnimationFrame(rafId);
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  }
  function setMode(m){
    $("g-start").classList.toggle("hide", m!=="start");
    $("g-live").classList.toggle("hide",  m!=="live");
    $("g-done").classList.toggle("hide",  m!=="done");
    badge.textContent = m==="live" ? "촬영 중 · "+RATIOS[rIdx].name
                     : m==="done" ? "촬영 완료 · "+RATIOS[rIdx].name : "촬영 준비";
  }

  /* ================= 이름 ================= */
  function renderChips(){
    const box=$("chips"); box.innerHTML="";
    names.forEach((n,i)=>{
      const d=document.createElement("div"); d.className="chip";
      d.innerHTML="<b></b><span>×</span>"; d.querySelector("b").textContent=n;
      d.onclick=()=>{ names.splice(i,1); renderChips(); refresh(); };
      box.appendChild(d);
    });
  }
  function addNames(raw){
    raw.split(/[,\n]/).map(s=>s.trim()).filter(Boolean).forEach(n=>{
      if(names.length<14 && !names.includes(n)) names.push(n);
    });
    $("name-input").value=""; renderChips(); refresh();
  }

  /* ================= 저장 ================= */
  async function save(){
    saveHint.textContent="";
    paint();
    const blob = await new Promise(r=>cv.toBlob(r,"image/jpeg",0.94));
    const fname = CFG.file + (names.length ? "_"+names.slice(0,3).join("-") : "") + ".jpg";
    const file = new File([blob],fname,{type:"image/jpeg"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:CFG.title}); return; }
      catch(e){ if(e && e.name==="AbortError") return; }
    }
    try{
      const url=URL.createObjectURL(blob), a=document.createElement("a");
      a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      saveHint.textContent="저장이 안 되면 위 사진을 길게 눌러 '이미지 저장'을 선택하세요.";
    }catch(e){ saveHint.textContent="위 사진을 길게 눌러 '이미지 저장'을 선택하세요."; }
  }

  /* ================= 이벤트 ================= */
  $("btn-start").onclick = ()=>{ errBox.style.display="none"; startCam(); };
  $("btn-off").onclick   = ()=>{ stopCam(); setMode("start"); source=null; refresh(); };
  $("btn-flip").onclick  = ()=>{ facing = facing==="environment"?"user":"environment"; startCam(); };
  $("btn-shot").onclick  = ()=>{
    if(!video.videoWidth){ alert("카메라 준비 중입니다. 잠시 후 다시 눌러주세요."); return; }
    const c=document.createElement("canvas");
    c.width=video.videoWidth; c.height=video.videoHeight;
    const g=c.getContext("2d");
    if(facing==="user"){ g.translate(c.width,0); g.scale(-1,1); }
    g.drawImage(video,0,0);
    source=c; running=false; cancelAnimationFrame(rafId);
    stopCam(); setMode("done"); refresh();
  };
  $("btn-retake").onclick = ()=>{ source=null; startCam(); };
  function cycleRatio(){
    rIdx = (rIdx+1) % RATIOS.length;
    badge.textContent = (source?"촬영 완료 · ":running?"촬영 중 · ":"") + RATIOS[rIdx].name;
    refresh();
  }
  $("btn-ratio").onclick = cycleRatio;
  $("btn-ratio2").onclick = cycleRatio;
  $("btn-add").onclick = ()=> addNames($("name-input").value);
  $("name-input").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); addNames(e.target.value); }});
  $("btn-save").onclick = save;

  $("fallback-file").addEventListener("change", e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const img=new Image();
    img.onload=()=>{ const c=document.createElement("canvas"); c.width=img.width; c.height=img.height;
      c.getContext("2d").drawImage(img,0,0); source=c; setMode("done"); refresh(); URL.revokeObjectURL(img.src); };
    img.src=URL.createObjectURL(f); e.target.value="";
  });
  window.addEventListener("pagehide", stopCam);

  /* 초기 화면: 빈 프레임 */
  refresh(); setMode("start");
})();
</script>
</body>
</html>
